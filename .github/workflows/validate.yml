name: OSM-CH public core validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r validator/requirements.txt
      - name: Public core regression suite
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=. python -m unittest discover -s tests -v
      - name: Validate synthetic pair through CLI
        run: |
          python validator/validate.py \
            --type examples/adresswechsel-melden.typ.json \
            --instance examples/adresswechsel-melden.instanz.json \
            --resolved-out /tmp/adresswechsel-melden.resolved.json
          diff -u examples/adresswechsel-melden.resolved.json /tmp/adresswechsel-melden.resolved.json
